name: Check Catalog

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check-catalog:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Run catalog rebuild
      run: python catalog/tools/build_catalog_index.py
    
    - name: Create Pull Request with updates
      if: failure()
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "Auto-update: rebuild catalog files"
        title: "Auto-update catalog files"
        body: "Automatically updated by GitHub Actions"
        branch: auto-update-catalog
        delete-branch: true
