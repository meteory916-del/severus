name: Check Catalog

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Даёт право сохранять файлы
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Run catalog rebuild and auto-commit
      run: |
        # 1. Запускаем скрипт БЕЗ --check, он обновит файлы
        python catalog/tools/build_catalog_index.py
        
        # 2. Сохраняем изменения в репозиторий
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add -A
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update catalog files" && git push)
