name: Check Catalog

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Run catalog rebuild
      run: python catalog/tools/build_catalog_index.py
    
    - name: Commit and push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add -A
        if ! git diff --staged --quiet; then
          echo "Changes detected. Committing and pushing..."
          git commit -m "Auto-update catalog files"
          git push
        else
          echo "No changes to commit. Catalog is up to date."
        fi
